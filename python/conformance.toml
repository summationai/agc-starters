# For agent.cloud's starter conformance suite only (which files its reload tests edit); `agc init` doesn't copy it.
[dev]
setup = "uv sync && npm ci"

[reload.api]
file = "app/main.py"
find = 'return {"status": "ok"}'
replace = 'return {"status": "reloaded"}'
url = "/api/health"
expect = "reloaded"

[reload.ui]
file = "web/src/App.tsx"
find = "is ready to build"
replace = "is ready to rebuild"
url = "/src/App.tsx"
expect = "is ready to rebuild"

[reload.worker]
file = "app/worker.py"
find = "worker ready"
replace = "worker reloaded"
expect = "worker reloaded"

[storage]
test = "uv run --frozen pytest -q tests/test_storage.py tests/test_uploads.py"
