[project]
name = "starter"
version = "0.1.0"
description = "An agent.cloud app: FastAPI, psycopg 3, a worker, and a React UI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "boto3>=1.43",
]

[dependency-groups]
dev = [
  "watchfiles>=0.24",
  "pytest>=8",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
