# For agent.cloud's starter conformance suite only (which files its reload tests edit); `agc init` doesn't copy it.
[dev]
setup = "npm ci"

[reload.api]
file = "server/app.ts"
find = "status: 'ok'"
replace = "status: 'reloaded'"
url = "/api/health"
expect = "reloaded"

[reload.ui]
file = "web/src/App.tsx"
find = "is ready to build"
replace = "is ready to rebuild"
url = "/src/App.tsx"
expect = "is ready to rebuild"

[reload.worker]
file = "server/worker.ts"
find = "worker ready"
replace = "worker reloaded"
expect = "worker reloaded"

[storage]
test = "node --test server/storage.test.ts"
